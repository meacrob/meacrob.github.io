<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Twitch connection</title>
<!-- DRAFT, NOT PUBLISHED. OAuth implicit-grant callback.
     Security: random single-use state checked; fragment cleared before anything else runs;
     token validated (our client id + channel:manage:clips) then revoked at once;
     token is never stored, logged or sent anywhere except Twitch's own validate/revoke URLs. -->
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#111513);--ink:light-dark(#141714,#e9ece9);--soft:light-dark(#5b625c,#a7b0a9);--ok:light-dark(#11633f,#5cc98f);--bad:#c0392b}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:48px 20px}
h1{font-size:28px;line-height:1.15}.ok{color:var(--ok)}.bad{color:var(--bad)}.soft{color:var(--soft);font-size:14px}
code{background:light-dark(#f1f3f1,#1d221f);padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<main>
<h1 id="title">Checking your Twitch connection…</h1>
<p id="msg"></p>
<p class="soft" id="note"></p>
</main>
<script>
{
const CLIENT_ID = "eb2is6iipvmbxv6vjydevpbwgrb6qm";
const NEED = "channel:manage:clips";
const MAX_AGE_MS = 10 * 60 * 1000;
const $ = id => document.getElementById(id);
const say = (t, m, cls, note) => { $("title").textContent = t; $("title").className = cls || ""; $("msg").textContent = m || ""; $("note").textContent = note || ""; };

// 1. Read and immediately clear the fragment so the token can't linger in history or be shared.
const frag = new URLSearchParams(location.hash.slice(1));
const query = new URLSearchParams(location.search);
history.replaceState(null, "", location.pathname);
const token = frag.get("access_token");
const gotState = frag.get("state") || query.get("state");

// 2. State: must match the one this browser generated, be fresh, and is consumed now (single use).
let saved = null;
try { saved = JSON.parse(sessionStorage.getItem("oauth_state") || "null"); sessionStorage.removeItem("oauth_state"); } catch (e) {}

async function revoke(tok) {
  try {
    await fetch("https://id.twitch.tv/oauth2/revoke", {method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: new URLSearchParams({client_id: CLIENT_ID, token: tok})});
  } catch (e) {}
}

(async () => {
  if (query.get("error")) { say("Connection cancelled", "Nothing was connected. You can close this page.", "bad"); return; }
  const stateOk = saved && gotState && saved.state === gotState && (Date.now() - saved.t) < MAX_AGE_MS;
  if (!stateOk) {
    if (token) await revoke(token);            // never act on a response we didn't ask for
    say("This link isn't valid", "Please start again from the partner page. Nothing was connected on our side.", "bad",
        "Reason: the security check (state) didn't match or expired.");
    return;
  }
  if (!token) { say("Something went wrong", "Twitch didn't return a connection. Please try again.", "bad"); return; }
  // 3. Validate: right app, right scope, who is this.
  let v = null;
  try {
    const r = await fetch("https://id.twitch.tv/oauth2/validate", {headers: {Authorization: "OAuth " + token}});
    v = r.ok ? await r.json() : null;
  } catch (e) {}
  // 4. Revoke the token now. The app authorisation stays; we only use our own app token from here on.
  await revoke(token);
  if (!v || v.client_id !== CLIENT_ID || !(v.scopes || []).includes(NEED)) {
    say("Connection not completed", "Twitch didn't confirm the clips permission. Please try again.", "bad");
    return;
  }
  const ref = "CR-" + v.user_id + "-" + new Date().toISOString().replace(/[-:]/g, "").slice(0, 15);
  say("Connected: " + v.login, "Thanks. Your consent reference is " + ref + ". Add it to the consent form if you haven't sent it yet.",
      "ok", "We didn't keep any Twitch token. To stop at any time: Twitch Settings > Connections > disconnect the engine test app.");
})();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffd9e8">
<title>Jelly Jars</title>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<div id="bg"><div id="scene"></div></div>
<canvas id="c"></canvas>
<div id="fx"></div>

<!-- HOME -->
<section id="home" class="screen">
  <div class="top">
    <button class="avatar" id="avatar"><img id="avatarImg" alt=""><b id="plv">Lv 1</b></button>
    <div class="grow"></div>
    <span class="pill"><svg viewBox="0 0 24 24"><path fill="#ffbf1f" stroke="#e89b00" stroke-width="1.5" d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg><span id="hStars">0</span></span>
    <span class="pill"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="8" ry="6.5" fill="#ff7aa8" stroke="#e83d72" stroke-width="1.5"/><ellipse cx="9" cy="10.5" rx="2.6" ry="1.4" fill="#fff" opacity=".8"/></svg><span id="hBeans">0</span></span>
    <button class="icon-btn" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><path fill="#8a5a7f" d="M19.4 13a7.5 7.5 0 000-2l2-1.6-2-3.4-2.4 1a7 7 0 00-1.7-1L15 3.5h-4l-.4 2.5a7 7 0 00-1.7 1l-2.4-1-2 3.4L6.6 11a7.5 7.5 0 000 2l-2 1.6 2 3.4 2.4-1a7 7 0 001.7 1l.3 2.5h4l.4-2.5a7 7 0 001.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 110-7 3.5 3.5 0 010 7z"/></svg></button>
  </div>
  <div class="hero">
    <div class="world" id="hWorld">Strawberry Grove</div>
    <button class="btn green playBtn" id="hPlay">Level 1<small id="hPlaySub">Clear 3 lines</small></button>
    <div class="next" id="hNext"></div>
  </div>
  <div class="cards">
    <button class="card panel" id="cClassic"><div class="ic" style="background:#ffeef4"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2.5" fill="#ff5f8f"/><rect x="13" y="3" width="8" height="8" rx="2.5" fill="#4fa3ff"/><rect x="3" y="13" width="8" height="8" rx="2.5" fill="#ffc93c"/><rect x="13" y="13" width="8" height="8" rx="2.5" fill="#6fd65a"/></svg></div><b>Classic</b><span id="cClassicSub">Best 0</span></button>
    <button class="card panel" id="cDaily"><div class="ic" style="background:#fff5d6"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4" fill="#ffbf1f"/><rect x="3" y="5" width="18" height="5" rx="2" fill="#ff9f1c"/><text x="12" y="19" font-size="9" text-anchor="middle" fill="#fff" font-family="Baloo" id="dIco">1</text></svg></div><b>Daily</b><span id="cDailySub">New puzzle</span></button>
    <button class="card panel" id="cMissions"><div class="ic" style="background:#e4fff6"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="4" fill="#2fc79a"/><path d="M8 9l2 2 4-4M8 15h8" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg></div><b>Missions</b><span id="cMissionsSub">0/3</span></button>
  </div>
  <nav class="nav" id="nav">
    <button data-go="home" class="on"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>Home</button>
    <button data-go="journey"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a7 7 0 00-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 1112 6a2.5 2.5 0 010 5z"/></svg>Journey</button>
    <button data-go="collection"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 3h10l1 3H6zm-2 4h14v12a3 3 0 01-3 3H8a3 3 0 01-3-3z"/></svg>Collection<i class="badge" id="colBadge" style="display:none">!</i></button>
    <button data-go="awards"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M7 3h10v3h3v2a5 5 0 01-5 5 5 5 0 01-2 1.5V18h3v3H8v-3h3v-3.5A5 5 0 019 13a5 5 0 01-5-5V6h3zm-1 5a3 3 0 001 2V8zm12 0h-1v2a3 3 0 001-2z"/></svg>Awards</button>
  </nav>
</section>

<!-- JOURNEY -->
<section id="journey" class="screen page">
  <div class="pagehead"><button class="icon-btn back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="#8a5a7f" stroke-width="3" fill="none" stroke-linecap="round"/></svg></button><h2>Jelly Journey</h2><span class="pill"><svg viewBox="0 0 24 24"><path fill="#ffbf1f" stroke="#e89b00" stroke-width="1.5" d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg><span id="jStars">0</span></span></div>
  <div class="scroll" id="map"></div>
</section>

<!-- COLLECTION -->
<section id="collection" class="screen page">
  <div class="pagehead"><button class="icon-btn back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="#8a5a7f" stroke-width="3" fill="none" stroke-linecap="round"/></svg></button><h2>Collection</h2><span class="pill" id="colCount">0/18</span></div>
  <div class="tabs"><button data-tab="friends" class="on">Jelly Friends</button><button data-tab="jars">Jars</button></div>
  <div class="scroll"><div id="colGrid" class="grid"></div></div>
</section>

<!-- AWARDS / STATS -->
<section id="awards" class="screen page">
  <div class="pagehead"><button class="icon-btn back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke="#8a5a7f" stroke-width="3" fill="none" stroke-linecap="round"/></svg></button><h2>Awards</h2></div>
  <div class="scroll"><div class="panel" style="padding:12px;margin-bottom:12px"><div class="statgrid" id="stats"></div></div><div id="achList"></div></div>
</section>

<!-- GAME HUD -->
<section id="hud" class="screen">
  <div class="bar">
    <div class="left">
      <button class="btn small ghost skip" id="skipTut">Skip tutorial</button>
      <button class="icon-btn" id="pause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#8a5a7f"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#8a5a7f"/></svg></button>
      <div class="goal panel" id="goal"><div class="gi" id="goalIco"></div><div><b id="goalVal">0/3</b><span id="goalTxt">Lines</span></div></div>
    </div>
    <div class="right">
      <div class="score panel"><b id="score">0</b><span id="scoreSub">Best 0</span></div>
      <div class="moves panel" id="movesBox"><b id="moves">20</b><span>Moves</span></div>
    </div>
  </div>
  <div class="jarTag" id="jarTag">Tap the jar!</div>
  <div class="pourBar panel" id="pourBar"><span id="pourInfo">Choose a spot</span><button class="btn small ghost" id="pourCancel">Cancel</button><button class="btn small" id="pourGo">Pour here</button></div>
  <div class="banner panel" id="stuck"><span id="stuckTxt">No room! Pour your jar.</span><button class="btn small ghost" id="giveUp">End</button></div>
</section>

<img class="hand" id="hand" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M24 6a5 5 0 0110 0v18l12 3a6 6 0 014 7l-3 16a8 8 0 01-8 7H28a8 8 0 01-6-3L10 38a5 5 0 017-7l7 6z' fill='%23fff' stroke='%234a2343' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
<div class="coach panel" id="coach"></div>

<!-- MODALS -->
<div class="modal" id="mResult"><div class="sheet panel" id="resultBody"></div></div>
<div class="modal" id="mLevel"><div class="sheet panel" id="levelBody"></div></div>
<div class="modal" id="mPause"><div class="sheet panel">
  <h2>Paused</h2>
  <button class="btn green" id="resume" style="width:100%">Resume</button>
  <button class="btn ghost" id="restart" style="width:100%">Restart</button>
  <button class="btn ghost" id="quit" style="width:100%">Home</button>
  <button class="btn ghost" id="pRules" style="width:100%">How to play</button>
  <div class="row"><button class="btn small ghost" id="pMusic">Music</button><button class="btn small ghost" id="pSfx">Sound</button></div>
</div></div>
<div class="modal" id="mSettings"><div class="sheet panel">
  <h2>Settings</h2>
  <button class="toggle" data-set="music">Music<i></i></button>
  <button class="toggle" data-set="sfx">Sound effects<i></i></button>
  <button class="toggle" data-set="haptics">Vibration<i></i></button>
  <button class="toggle" data-set="saver">Battery saver<i></i></button>
  <button class="btn small ghost" id="rulesBtn">How to play</button>
  <button class="btn small ghost" id="tutBtn">Replay tutorial</button>
  <button class="btn small ghost" id="reportBtn">Copy playtest report</button>
  <button class="btn small ghost" id="perfBtn">Performance overlay</button>
  <button class="btn small ghost" id="resetBtn">Reset progress</button>
  <button class="btn" data-close style="width:100%">Done</button>
  <span class="sub">Jelly Jars 2.0 · development build</span>
</div></div>
<div class="modal" id="mMissions"><div class="sheet panel" id="missionsBody"></div></div>
<div class="modal" id="mInfo"><div class="sheet panel" id="infoBody"></div></div>

<div id="perf" class="min"><button id="perfMin" style="float:right">more</button><div id="perfTxt"></div>
  <div id="knobs">
    <select id="kMode"><option value="pour">Pour (fill)</option><option value="clear">Clear (old)</option></select>
    <select id="kShape"><option>3x3</option><option>plus</option><option>small</option><option>diamond</option><option>cross</option></select>
    <select id="kCap"><option>4</option><option>6</option><option>8</option><option>10</option><option>12</option></select>
    <select id="kGrow"><option>1</option><option>1.4</option><option>1.6</option><option>2</option><option>2.5</option></select>
    <select id="kDpr"><option value="auto">DPR auto</option><option>0.75</option><option>1</option><option>1.5</option><option>2</option></select>
    <button id="perfCopy">Copy report</button>
  </div>
</div>
<div id="boot"><h1>Jelly<br>Jars</h1></div>

<script src="vendor/three.min.js"></script>
<script src="src/logic.js?v=7"></script>
<script src="src/bot.js?v=7"></script>
<script src="src/levels.js?v=7"></script>
<script src="src/meta.js?v=7"></script>
<script src="src/audio.js?v=7"></script>
<script src="art/chars.js?v=7"></script>
<script src="src/scenery.js?v=7"></script>
<script src="src/mascot.js?v=7"></script>
<script src="src/render.js?v=7"></script>
<script src="src/app.js?v=7"></script>
</body>
</html>

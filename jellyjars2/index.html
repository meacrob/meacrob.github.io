<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2a1a5e">
<title>Jelly Jars 2.0 prototype</title>
<style>
@font-face{font-family:Baloo;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:block}
@font-face{font-family:Nunito;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{font-family:Nunito,system-ui,sans-serif;font-weight:800;color:#fff;
 background:radial-gradient(120% 70% at 50% 18%,#7d52e8 0%,#4b2bb0 38%,#26135e 75%,#170a3a 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
 background:radial-gradient(circle at 12% 30%,rgba(255,120,200,.35) 0 2px,transparent 3px) 0 0/90px 110px,
 radial-gradient(circle at 70% 60%,rgba(140,220,255,.3) 0 1.5px,transparent 2.5px) 0 0/70px 80px}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#scoreBox{pointer-events:none}
#score{font-family:Baloo;font-size:clamp(38px,11vw,56px);line-height:1;text-shadow:0 3px 0 #2a0f6b,0 6px 16px rgba(0,0,0,.35);display:inline-block}
#score.bump{animation:bump .3s}
@keyframes bump{40%{transform:scale(1.14)}}
.lbl{font-size:12px;opacity:.75;letter-spacing:.08em;text-transform:uppercase}
#bestBox{font-size:15px;opacity:.9;margin-top:2px}
#pause{pointer-events:auto;width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px;font-family:Baloo;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:Baloo;white-space:nowrap;animation:popin 1.25s cubic-bezier(.2,1.4,.4,1) forwards}
.pop.big{font-size:clamp(40px,12vw,64px);color:#fff;text-shadow:0 4px 0 #c0307a,0 8px 22px rgba(120,0,80,.5)}
.pop.combo{top:52%;font-size:clamp(28px,8vw,40px);color:#ffe14d;text-shadow:0 3px 0 #b5651d,0 6px 16px rgba(0,0,0,.3)}
.pop.best{top:16%;font-size:26px;color:#7dffb5;text-shadow:0 3px 0 #127048}
@keyframes popin{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}18%{transform:translate(-50%,-50%) scale(1.12);opacity:1}30%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1;transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-80%) scale(.9)}}
.pts{position:absolute;transform:translate(-50%,-50%);font-family:Baloo;font-size:26px;color:#fff;text-shadow:0 2px 0 #5a2bb8,0 4px 10px rgba(0,0,0,.35);animation:rise 1s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .25s;padding:24px;text-align:center}
.screen.on{opacity:1;pointer-events:auto}
#title{background:radial-gradient(80% 60% at 50% 45%,rgba(40,14,100,.55),rgba(16,6,40,.88));backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
body.attitle #hud{opacity:0}
#hud{transition:opacity .3s}
#title h1{font-family:Baloo;font-size:clamp(52px,16vw,84px);line-height:.9;margin:0;text-shadow:0 5px 0 #c0307a,0 10px 30px rgba(0,0,0,.4);transform:rotate(-3deg)}
#title h1 span{display:block;color:#ffe14d;text-shadow:0 5px 0 #b5651d,0 10px 30px rgba(0,0,0,.4)}
#title p{margin:0;opacity:.85;max-width:300px;line-height:1.35}
.btn{border:0;font-family:Baloo;font-size:26px;color:#fff;padding:14px 44px;border-radius:22px;background:linear-gradient(#ff6fb0,#e8327f);box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 8px 20px rgba(200,30,110,.45);min-width:200px}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.alt{background:rgba(255,255,255,.16);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);font-size:20px;padding:10px 30px}
#gameover{background:rgba(20,8,50,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.card{background:linear-gradient(#5b37c9,#3a1f8e);border-radius:28px;padding:22px 26px 26px;box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 20px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;gap:10px;min-width:270px;transform:scale(.85);transition:transform .35s cubic-bezier(.2,1.5,.4,1)}
.screen.on .card{transform:scale(1)}
#goTitle{font-family:Baloo;font-size:30px}
#goScore{font-family:Baloo;font-size:64px;line-height:1;color:#ffe14d;text-shadow:0 4px 0 #b5651d}
#goStats{font-size:14px;opacity:.8}
#menu{background:rgba(20,8,50,.6)}
#stuck{top:auto;bottom:calc(25% + env(safe-area-inset-bottom));inset-inline:0;height:auto;background:none;padding:0}
#stuck .card{padding:14px 18px;gap:8px}
#stuck p{margin:0;font-size:16px}
#aimHint{position:fixed;left:5%;width:58%;top:calc(17% + env(safe-area-inset-top));text-align:left;line-height:1.1;font-family:Baloo;font-size:22px;opacity:0;transition:opacity .2s;pointer-events:none;text-shadow:0 2px 0 #c0307a}
#aimHint.on{opacity:1}
#jarBtn{position:fixed;transform-origin:50% 50%;white-space:nowrap;font-family:Baloo;font-size:15px;padding:4px 10px;border-radius:12px;background:#ff5fa8;opacity:0;translate:-50% 0;transform:scale(.5);transition:opacity .3s,transform .3s cubic-bezier(.2,1.6,.4,1);pointer-events:none;box-shadow:0 4px 12px rgba(200,30,110,.5)}
#jarBtn.on{opacity:1;transform:scale(1);animation:nudge 1.2s infinite}
@keyframes nudge{50%{transform:scale(1.12)}}
#perf{position:fixed;left:4px;top:calc(92px + env(safe-area-inset-top));font:9px/1.3 ui-monospace,monospace;background:rgba(0,0,0,.55);padding:4px 6px;border-radius:8px;display:none;max-width:62vw;white-space:pre-wrap;z-index:9;color:#bfffcf;pointer-events:auto}
#perf.min #perfTxt div:nth-child(n+3),#perf.min #knobs{display:none}
#knobs{display:flex;flex-wrap:wrap;gap:2px}
#perf.on{display:block}
#perf select,#perf button{font:10px ui-monospace,monospace;padding:1px}
</style>
</head>
<body class="attitle">
<canvas id="c"></canvas>
<div id="hud">
  <div id="scoreBox"><div id="score">0</div><div id="bestBox"><span class="lbl">Best</span> <span id="best">0</span></div></div>
  <button id="pause" aria-label="Menu">II</button>
</div>
<div id="fx"></div>
<div id="aimHint">Tap the board to pour your jelly</div>
<div id="jarBtn">Tap me!</div>

<div id="title" class="screen on">
  <h1>Jelly<span>Jars</span></h1>
  <p>Drag jellies onto the board. Fill a row or column to clear it. Clears fill your jar, then pour it to rescue a tight spot.</p>
  <button class="btn" id="play">Play</button>
</div>

<div id="gameover" class="screen"><div class="card">
  <div id="goTitle">Out of moves</div>
  <div id="goScore">0</div>
  <div><span class="lbl">Best</span> <span id="goBest">0</span></div>
  <div id="goStats"></div>
  <button class="btn" id="again">Play again</button>
  <button class="btn alt" id="home">Home</button>
</div></div>

<div id="menu" class="screen"><div class="card">
  <div id="goTitle2" style="font-family:Baloo;font-size:30px">Paused</div>
  <button class="btn" id="resume">Resume</button>
  <button class="btn alt" id="restart">Restart</button>
  <button class="btn alt" id="sound">Sound: On</button>
  <button class="btn alt" id="perfBtn">Perf overlay</button>
</div></div>

<div id="stuck" class="screen"><div class="card">
  <p>No room! Pour your jar to make space.</p>
  <button class="btn alt" id="giveUp">End run</button>
</div></div>

<div id="perf" class="min"><button id="perfMin" style="float:right;font:10px monospace">more</button><div id="perfTxt"></div>
  <div id="knobs">
    <select id="kMode"><option value="pour">Pour (fill)</option><option value="clear">Clear (old)</option></select>
    <select id="kShape"><option>3x3</option><option>plus</option><option>small</option><option>diamond</option><option>cross</option></select>
    <select id="kCap"><option>4</option><option>5</option><option>6</option><option>8</option><option>10</option></select>
    <select id="kGrow"><option>1</option><option>1.2</option><option>1.4</option><option>1.6</option><option>2</option></select>
    <select id="kDpr"><option value="auto">DPR auto</option><option>1</option><option>1.5</option><option>2</option><option>3</option></select>
    <button id="perfCopy">Copy report</button>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="src/logic.js?v=1"></script>
<script src="src/audio.js?v=1"></script>
<script src="src/render.js?v=1"></script>
<script src="src/main.js?v=1"></script>
</body>
</html>
